name: CI Pipeline
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/build.yml@2153cd76b687692e40505877e442d10b6cd3e0ff # v0.1.1
    with:
      branch_name: ${{ github.ref }}
  docker-build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/docker-build.yml@2153cd76b687692e40505877e442d10b6cd3e0ff # v0.1.1
    with:
      branch_name: ${{ github.ref }}
  static-analysis:
    permissions:
      contents: read
      security-events: write
      actions: read
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/static-analysis.yml@2153cd76b687692e40505877e442d10b6cd3e0ff # v0.1.1
    with:
      staticcheck_version: 'v0.8.1'
      branch_name: ${{ github.ref }}
  lint:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/lint.yml@2153cd76b687692e40505877e442d10b6cd3e0ff # v0.1.1
    with:
      golangci_lint_version: 'v2.13.2'
      branch_name: ${{ github.ref }}
  hadolint:
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/hadolint.yml@2153cd76b687692e40505877e442d10b6cd3e0ff # v0.1.1
    with:
      branch_name: ${{ github.ref }}
  license-check:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/license-check.yml@2153cd76b687692e40505877e442d10b6cd3e0ff # v0.1.1
    with:
      branch_name: ${{ github.ref }}
  fossa-scan:
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/fossa-scan.yml@2153cd76b687692e40505877e442d10b6cd3e0ff # v0.1.1
    with:
      branch_name: ${{ github.ref }}
  unit-tests:
    permissions:
      contents: read
      checks: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/unit-test.yml@2153cd76b687692e40505877e442d10b6cd3e0ff # v0.1.1
    with:
      branch_name: ${{ github.ref }}
  analysis:
    if: github.repository_owner == 'omec-project'
    permissions:
      actions: read
      artifact-metadata: read
      attestations: read
      checks: read
      code-quality: read
      contents: read
      deployments: read
      discussions: read
      drives: read
      id-token: write
      issues: read
      models: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: write
      statuses: read
      vulnerability-alerts: read
    uses: omec-project/.github/.github/workflows/scorecard-analysis.yml@2153cd76b687692e40505877e442d10b6cd3e0ff # v0.1.1
    with:
      branch_name: ${{ github.ref }}
  e2e-tests:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/e2e-test.yml@2153cd76b687692e40505877e442d10b6cd3e0ff # v0.1.1
    with:
      branch_name: ${{ github.ref }}
